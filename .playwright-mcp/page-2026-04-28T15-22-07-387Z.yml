            - heading "The hypothesis" [level=3] [ref=e91]
            - paragraph [ref=e92]: "Some sequence tasks contain durable structural invariants: binding, scope, graph topology, proof state, dependency paths, aliasing, or semantic role structure. A model with a dedicated phase-like stream may learn a compact coordinate system for those invariants instead of forcing every property through the same residual representation."
          - article [ref=e93]:
            - img [ref=e94]
            - heading "The narrowed claim" [level=3] [ref=e98]
            - paragraph [ref=e99]: "The current evidence does not justify claims about general language modeling superiority. The live claim is narrower: phase-stream architectures are plausible structural priors, and the right evaluation is a battery of tasks where structure is required, surface cues are controlled, and ablations distinguish stream capacity from attention-bias effects."
          - article [ref=e100]:
            - img [ref=e101]
            - heading "The research standard" [level=3] [ref=e105]
            - paragraph [ref=e106]: A result counts only if it survives iso-parameter baselines, phase-only and bias-only ablations, multiple seeds, hard negatives, and representation probes. Microvalidations are indicators; the target is a respectable literature task plus controlled synthetic tasks that reveal why a mechanism helps.
