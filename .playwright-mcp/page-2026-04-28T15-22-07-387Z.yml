          - heading "Resonance Transformers as a structural-prior research program" [level=1] [ref=e46]
          - paragraph [ref=e47]: "This project studies whether a dedicated phase-like stream can help transformer models represent topology-bearing structure: binding, graph relations, proof state, unification constraints, protocol traces, and controlled natural-language syntax."
          - paragraph [ref=e48]: The current evidence is promising but narrow. The strongest early signal is on a low-data BLiMP wh-island regime, and it points more toward the usefulness of a separate phase/structural stream than toward the original additive attention-bias mechanism. The project is now organized around falsifiable ablations, better tasks, and interpretability tools that can say what the phase stream actually encodes.
